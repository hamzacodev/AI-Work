[project]
name = "dealdesk-backend"
version = "0.1.0"
description = "DealDesk backend: FastAPI, LangGraph agents, Limit Checker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "openai>=3.22.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "tavily-python>=0.8.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
